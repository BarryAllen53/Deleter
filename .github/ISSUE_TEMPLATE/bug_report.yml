name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Application version, description: Include the version shown by the app.}
    validations: {required: true}
  - type: input
    id: windows
    attributes: {label: Windows version}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: Include installation type, language, and screen reader if relevant.}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized logs, description: Remove usernames, private paths, and secrets.}
