name: Feature request
description: Suggest a safety-focused improvement.
title: "[Feature]: "
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem and user impact}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Safety and accessibility considerations}
