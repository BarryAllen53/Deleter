name: Windows release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m PyInstaller --noconfirm --clean --name Deleter --windowed app/__main__.py
      - name: Sign portable executable when a certificate is configured
        if: ${{ env.WINDOWS_PFX_BASE64 != '' && env.WINDOWS_PFX_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'deleter-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          & signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist/Deleter/Deleter.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $pfx -Force
      - shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, README.de.md, README.tr.md, CHANGELOG.md -Destination dist/Deleter
          Compress-Archive -Path dist/Deleter -DestinationPath dist/Deleter-${{ github.ref_name }}-portable.zip
          $hash = (Get-FileHash dist/Deleter-${{ github.ref_name }}-portable.zip -Algorithm SHA256).Hash
          "$hash  Deleter-${{ github.ref_name }}-portable.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Deleter-${{ github.ref_name }}-portable.zip
            dist/SHA256SUMS.txt

